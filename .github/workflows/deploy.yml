name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, new-horizons]
    tags: ['v*']

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Deploy World (prod)
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-dev:
    if: github.ref == 'refs/heads/new-horizons'
    runs-on: ubuntu-latest
    name: Deploy World (dev.joinrabble.world)
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Wrangler (dev)
        run: npx wrangler deploy -c wrangler.dev.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
