<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
  <title>RaBbLE · Architect</title>
  <script src="js/RaBbLE-config.js"></script>
  <script src="js/RaBbLE-aether.js"></script>
  <link rel="stylesheet" href="css/RaBbLE-admin.css">
</head>
<body class="rabble-grid-bg">
  <main class="rabble-container admin">
    <p class="rabble-eyebrow">Architect</p>
    <h1 class="admin-title">Invites</h1>

    <!-- Sign-in: the password goes to sCoRE only and the token lives in this page's memory, not in storage. -->
    <section id="signin" class="rabble-card rabble-card-cyan admin-panel">
      <div class="rabble-card-title">Sign in</div>
      <form id="signin-form" class="rabble-card-body admin-form" autocomplete="on">
        <label>Username or email
          <input class="rabble-input" id="identifier" name="username" autocomplete="username" required>
        </label>
        <label>Password
          <input class="rabble-input" id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="rabble-btn rabble-btn-cyan" type="submit">Sign in</button>
        <p class="admin-msg" id="signin-msg" role="alert"></p>
      </form>
    </section>

    <section id="console" class="admin-hidden">
      <div class="admin-bar">
        <span id="who" class="admin-muted"></span>
        <button class="rabble-btn rabble-btn-ghost rabble-btn-sm" id="signout" type="button">Sign out</button>
      </div>

      <div class="rabble-card rabble-card-violet admin-panel">
        <div class="rabble-card-title">Mint an invite</div>
        <form id="mint-form" class="rabble-card-body admin-form">
          <label>Who is it for (a note only you see)
            <input class="rabble-input" id="note" maxlength="120" placeholder="e.g. Mark, personal">
          </label>
          <label>Good for (days)
            <input class="rabble-input" id="days" type="number" min="1" max="30" value="7">
          </label>
          <button class="rabble-btn rabble-btn-cyan" type="submit">Mint invite</button>
          <p class="admin-msg" id="mint-msg" role="status"></p>
        </form>
        <div id="fresh" class="admin-hidden admin-fresh">
          <p class="admin-muted">Copy it now. It is shown in full here and in the list below until it is used.</p>
          <code id="fresh-token" class="admin-token"></code>
          <button class="rabble-btn rabble-btn-ghost rabble-btn-sm" id="copy" type="button">Copy</button>
        </div>
      </div>

      <div class="rabble-card admin-panel">
        <div class="rabble-card-title">All invites</div>
        <div class="rabble-card-body">
          <p class="admin-muted" id="list-empty">None yet.</p>
          <ul id="list" class="admin-list"></ul>
        </div>
      </div>
    </section>
  </main>
  <script src="js/RaBbLE-admin.js"></script>
</body>
</html>
